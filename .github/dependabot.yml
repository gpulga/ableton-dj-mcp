version: 2

# All dependency updates (npm + GitHub Actions) land in ONE pull request.
# Dependabot keeps updating that PR as new versions come out; nothing merges
# automatically -- a maintainer reviews, approves, and merges it by hand.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels:
      - deps
    assignees:
      - gpulga

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # eslint 10 breaks the build in three ways and CI cannot catch it,
      # because npm ci fails before any job runs. See PR #274.
      #   - eslint-plugin-import caps its eslint peer at ^9 (no v10 release yet)
      #   - @eslint/js stops arriving transitively; eslint.config.js imports it
      #   - eslint-plugin-unicorn >=72 requires eslint >=10.4, so the two
      #     plugins cannot both be satisfied
      # Unblock once eslint-plugin-import supports eslint 10, or once that
      # plugin is replaced by eslint-import-resolver-typescript + tsc.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: eslint-plugin-unicorn
        versions: [">=66"]
      # @eslint/js is eslint's companion package and must stay in lockstep
      # with the eslint ignore rule above, or it can bump to 10.x on its own
      # (as it did in #278) even though eslint itself is still pinned at 9.
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # @typescript-eslint/eslint-plugin@8.65.0 caps its typescript peer at
      # <6.1.0. Dependabot bumped typescript straight to 7.0.2 in #276,
      # which fails that peer check, so npm ci fails before any job runs
      # (same failure mode as the eslint case above). Unblock once
      # @typescript-eslint raises its typescript ceiling.
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
